# =======================================================
# MDM RENTAL - BACKEND
# =======================================================
server {
    listen 80;
    server_name api.yourdomain.com; # Replace with your actual backend domain

    # High max body size for APK uploads (Standalone MDM feature)
    client_max_body_size 200M;

    location / {
        # Using the exact container_name defined in docker-compose.yml
        set $target_backend http://rental_backend:3001;
        proxy_pass $target_backend;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (useful if NestJS uses WebSockets later)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# =======================================================
# MDM RENTAL - FRONTEND
# =======================================================
server {
    listen 80;
    server_name mdm.yourdomain.com; # Replace with your actual frontend domain

    # Next.js frontend doesn't need massive uploads
    client_max_body_size 10M;

    location / {
        # Using the exact container_name defined in docker-compose.yml
        set $target_frontend http://rental_frontend:3000;
        proxy_pass $target_frontend;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js hot-reloading (if used in dev) and general WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
